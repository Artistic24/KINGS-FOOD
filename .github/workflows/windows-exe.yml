name: Build KINGS FOOD Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-exe.yml"
  pull_request:
    paths:
      - "electron/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repository lockfile is currently out of sync with package.json.
      # npm install reconciles it before building; npm ci exits before the build starts.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate a Windows-compatible multi-size KINGS FOOD icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; Image.open('assets/icon-only.png').convert('RGBA').resize((256,256), Image.Resampling.LANCZOS).save('assets/kings-food.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Check Electron main-process syntax
        run: node --check electron/main.cjs

      - name: Build Windows installer
        run: npm run windows:build

      - name: Smoke-test that the desktop app starts
        shell: pwsh
        run: |
          $appPath = Join-Path $PWD "release\win-unpacked\KINGS FOOD.exe"
          if (-not (Test-Path $appPath)) {
            throw "The unpacked KINGS FOOD application executable was not produced."
          }
          $appProcess = Start-Process -FilePath $appPath -WorkingDirectory (Split-Path $appPath) -PassThru
          Start-Sleep -Seconds 8
          $appProcess.Refresh()
          if ($appProcess.HasExited) {
            throw "KINGS FOOD exited during the Windows launch smoke test."
          }
          Write-Host "KINGS FOOD remained running for 8 seconds."
          & taskkill.exe /PID $appProcess.Id /T /F | Out-Null

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File
          if (-not $installer) { throw "No Windows installer was produced." }
          $installer | Format-Table Name, Length

      - name: Read package version
        id: package_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KINGS-FOOD-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows installer to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.package_version.outputs.version }}
          name: KINGS FOOD Windows v${{ steps.package_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          fail_on_unmatched_files: true
          make_latest: false
          body: |
            KINGS FOOD for Windows (64-bit).

            - Branded Windows executable and installer using the KINGS FOOD KF logo.
            - Opens the deployed KINGS FOOD marketplace in a dedicated desktop window.
            - Requires internet access and the deployed website at https://kings-marketplace.lovable.app to remain available.
            - If the website cannot be reached, the app displays a retryable connection screen instead of a blank window.
