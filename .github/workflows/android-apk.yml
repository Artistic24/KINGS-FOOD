name: Build KINGS FOOD Android APK

# Produces a downloadable APK on every push to main and on manual runs.
# The APK is a native Android shell that loads the live KINGS FOOD site,
# so GPS, camera (ID / face verification) and push-style alerts all work.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm i --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingsfood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: KINGS FOOD APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
