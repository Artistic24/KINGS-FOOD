name: Build KINGS FOOD Android APK

# Produces a downloadable APK on every push to main and on manual runs.
# The APK is a native Android shell that loads the live KINGS FOOD site,
# so GPS, camera (ID / face verification) and push-style alerts all work.
# Release refresh: rebuild latest APK from current main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build the web app for the native Android bundle
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "Missing GitHub Actions secret: VITE_GOOGLE_WEB_CLIENT_ID"
            exit 1
          fi
          npm run build

      - name: Install Capacitor Android runtime
        run: npm i --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate the Android project
        run: |
          npx cap add android
          python3 - <<'PY
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          if variables.exists():
            text = variables.read_text()
            text = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 26", text)
            variables.write_text(text)

          main_activity = next(Path("android/app/src/main/java").rglob("MainActivity.java"))
          source = main_activity.read_text()
          package_match = re.search(r"^package\s+([\w.]+);", source, re.MULTILINE)
          if not package_match:
            raise RuntimeError("Could not find MainActivity package declaration")
          package_name = package_match.group(1)
          main_activity.write_text("""package PACKAGE_NAME;

          import android.content.Intent;
          import android.util.Log;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);

              if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN
                  && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                if (pluginHandle == null) {
                  Log.i("Google Activity Result", "SocialLogin login handle is null");
                  return;
                }

                Plugin plugin = pluginHandle.getInstance();
                if (!(plugin instanceof SocialLoginPlugin)) {
                  Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                  return;
                }

                ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
              }
            }

            @Override
            public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          """.replace("PACKAGE_NAME", package_name))
          PY
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path).read()
          permissions = """  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
          """
          xml = xml.replace("<application", permissions + "\n    <application", 1)
          open(path, "w").write(xml)
          PY
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          fi
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android

      - name: Verify the Android app is using the bundled web build
        run: |
          test -f dist/index.html
          test -f android/app/src/main/assets/public/index.html

      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingsfood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: KINGS FOOD APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows 32-bit + 64-bit installer
        run: npm run windows:build

      - name: Sign Windows installer with Microsoft Azure Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply Microsoft-trusted Authenticode signature
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows installer was produced."
          }
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "Signature status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is not valid."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingsfood-windows-setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Windows installer to release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "windows-v$version"
          $title = "KINGS FOOD Windows v$version"
          $exe = (Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1).FullName
          $notes = @"
          KINGS FOOD Windows desktop release.

          - One NSIS installer containing both Windows x64 (64-bit) and ia32 (32-bit) application builds.
          - Built with Electron 43.7.9 so the 32-bit Windows target remains supported.
          - The desktop shell loads the current KINGS FOOD application.

          The installer automatically selects the correct architecture for the Windows machine.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "$title" --notes "$notes" --target $env:GITHUB_SHA
          }
