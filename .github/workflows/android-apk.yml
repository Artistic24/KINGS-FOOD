name: Build KINGS FOOD Android APK

# Produces a downloadable APK on every push to main and on manual runs.
# The APK is a native Android shell that loads the live KINGS FOOD site,
# so GPS, camera (ID / face verification) and push-style alerts all work.
# Release refresh: rebuild latest APK from current main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android runtime
        run: npm i --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate the Android project
        run: |
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          if variables.exists():
            text = variables.read_text()
            text = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 26", text)
            variables.write_text(text)

          main_activity = next(Path("android/app/src/main/java").rglob("MainActivity.java"))
          source = main_activity.read_text()
          package_match = re.search(r"^package\s+([\w.]+);", source, re.MULTILINE)
          if not package_match:
            raise RuntimeError("Could not find MainActivity package declaration")
          package_name = package_match.group(1)
          main_activity.write_text("""package PACKAGE_NAME;

          import android.content.Intent;
          import android.util.Log;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);

              if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN
                  && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                if (pluginHandle == null) {
                  Log.i("Google Activity Result", "SocialLogin login handle is null");
                  return;
                }

                Plugin plugin = pluginHandle.getInstance();
                if (!(plugin instanceof SocialLoginPlugin)) {
                  Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                  return;
                }

                ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
              }
            }

            @Override
            public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          """.replace("PACKAGE_NAME", package_name))
          PY
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          xml = open(path).read()
          permissions = """  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
          <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
          """
          xml = xml.replace("<application", permissions + "\n    <application", 1)
          open(path, "w").write(xml)
          PY
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          fi
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android

      - name: Build the APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingsfood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: KINGS FOOD APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
