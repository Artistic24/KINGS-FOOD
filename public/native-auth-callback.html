<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signing in — KINGS FOOD</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; color: #1a1a1a; }
      main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 999px; background: #f15a0a; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Signing you in…</h1>
        <p>Returning to the KINGS FOOD app.</p>
        <a id="open" href="#">Open KINGS FOOD</a>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        new URLSearchParams(window.location.hash.replace(/^#/, "")).forEach(function (v, k) {
          params.set(k, v);
        });
        history.replaceState(null, "", window.location.pathname);
        var url =
          "intent://auth-callback?" + params.toString() +
          "#Intent;scheme=com.kingsfood.app;package=com.kingsfood.app;end";
        document.getElementById("open").href = url;
        window.location.replace(url);
      })();
    </script>
  </body>
</html>
